# =============================================================================
#                            tmux Configuration
# =============================================================================
# Note on the -n (no prefix) bindings below: Alt+arrows, Alt+digits and
# Ctrl+arrows are bound globally on purpose, to match the same movements in
# XMonad and Emacs. They do shadow those keys for applications running inside
# tmux, which is the accepted trade-off here.

# Change bind key
#unbind C-b
#set -g prefix C-x

set -g mouse on

# Start counting from 1
set -g base-index 1
setw -g pane-base-index 1
# Keep the numbering gap-free after closing a window
set -g renumber-windows on

# Visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Status bar
set-window-option -g window-status-current-style bg='#dd4814'
set -g status-right "%R %d-%b-%Y"
# #W keeps the (automatically renamed) window name visible
set-window-option -g window-status-format "#I:#W#F"
set-window-option -g window-status-current-format "#I:#W#F"

# History. This is a session option, so `set`, not `setw`.
set -g history-limit 50000

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Terminal behaviour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 24-bit colour where supported
set -sg escape-time 10                      # don't swallow Esc in Emacs/vi
set -g focus-events on
setw -g mode-keys emacs

# Copy/Paste. Bound behind the prefix: `bind -n C-y` used to grab Ctrl+Y
# globally, which shadows readline's yank in every shell inside tmux.
bind ] paste-buffer
bind C-y paste-buffer

# Create a new window
unbind c
bind C-f new-window -c "#{pane_current_path}"

# Splitting
unbind '"'
bind 2 split-window -v -c '#{pane_current_path}'
unbind %
bind 3 split-window -h -c '#{pane_current_path}'

# Moving around pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Moving around window
bind Left previous-window
bind Right next-window

bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# Swap windows
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Go to window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Resizing pane
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2
